[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autoprotocol"
version = "0.1.0"
description = "Локальное автопротоколирование совещаний — инфраструктурный каркас"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1.6,<4",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2025.2",
  "psutil>=7,<8",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.2,<2",
    "psutil>=7,<8",
]
diarization = [
    "av>=18,<19",
    "psutil>=7,<8",
    "pyannote-audio>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoprotocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
